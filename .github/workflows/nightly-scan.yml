name: nightly-scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: deep scan
        run: bash scanning/nightly.sh
      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: scanning/reports/
          retention-days: 30
