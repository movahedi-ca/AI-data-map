rules:
  - id: hardcoded-secret
    languages:
      - javascript
    severity: ERROR
    metadata:
      contract_severity: critical
      category: security
    message: >-
      Possible hardcoded secret: a known key prefix (sk-, AKIA, xox-, ghp_,
      ...), a key-like name assigned a long string, or a long high-entropy
      string literal in an assignment or comparison. Secrets belong in the
      environment or the Secure Vault, never in the repo. Pinned integrity
      hashes in tests are the known benign case; they carry scan-allow.
    patterns:
      - pattern-either:
          # Known provider key prefixes.
          - pattern-regex: (?m)\b(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[bap]-[A-Za-z0-9-]{10,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|glpat-[A-Za-z0-9_-]{20,})
          # apiKey / secret / password style names given a string of 8+ chars.
          - pattern-regex: (?im)^[^\n#/:]*\b(api[_-]?key|apikey|secret|passwd|password|private[_-]?key|client[_-]?secret|access[_-]?token)\b\s*[:=]\s*['"][^'"\n]{8,}
          # Long high-entropy string in an assignment or comparison. Exactly
          # 64 hex chars (a sha256 digest) is excluded: this codebase pins
          # integrity hashes deliberately (MODEL_SHA256, H0), and those are
          # covered by the dependency-hygiene tests, not this rule.
          - pattern-regex: (?m)={1,3}\s*['"](?![0-9a-fA-F]{64}['"])[A-Za-z0-9+/=_-]{40,}['"]
